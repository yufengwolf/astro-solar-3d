<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在前往目标页面</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body { background: #05070f; color: #d7e4ff;
               font: 15px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
        .go-wrap { max-width: 620px; margin: 18vh auto 0; padding: 0 24px; text-align: center; }
        .go-wrap h1 { font-size: 20px; margin: 0 0 12px; }
        .go-wrap p { color: #93a7c8; margin: 8px 0; }
        .go-wrap code { background: rgba(127, 227, 224, 0.12); color: #7fe3e0;
                        padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .go-wrap a { display: inline-block; margin-top: 18px; padding: 8px 18px; color: #7fe3e0;
                     border: 1px solid rgba(127, 227, 224, 0.45); border-radius: 8px; text-decoration: none; }
        .go-wrap a:hover { background: rgba(127, 227, 224, 0.12); }
    </style>
</head>
<body>
    <div class="go-wrap" id="goWrap">
        <h1>正在前往目标页面…</h1>
        <p>支持 <code>?body=</code> 天体、<code>?node=</code> 层级节点、<code>?page=</code> 整页。</p>
        <p>如果这个页面没有自动跳转，请打开外链清单。</p>
    </div>
    <script type="module" src="./entries/go.js"></script>
</body>
</html>
